name: Compile LaTeX Document

on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '.github/workflows/latex.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install additional LaTeX packages
      run: |
        cat << 'EOF' > texlive.packages
        geometry
        booktabs
        siunitx
        hyperref
        amsmath
        amssymb
        graphicx
        enumitem
        microtype
        parskip
        setspace
        floatflt
        wrapfig
        bm
        mathrsfs
        amsthm
        tikz
        xcolor
        EOF
        sudo tlmgr install --file=texlive.packages
    
    - name: Compile LaTeX document
      uses: xu-cheng/texlive-action@v3
      with:
        run: |
          latexmk -pdf -interaction=nonstopmode pneumatic.tex
    
    - name: Save LaTeX log
      if: always()
      run: |
        if [ -f pneumatic.log ]; then
          cp pneumatic.log ./latexmk.log
        fi
    
    - name: Upload LaTeX log as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: latexmk-log
        path: ./latexmk.log
        retention-days: 1
    
    - name: Upload PDF as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: main-pdf
        path: pneumatic.pdf
        retention-days: 30
    
    - name: Create or update compiled-pdf branch
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.github.com"
        
        # Configure git to allow pushing
        git config --global push.default simple
        
        # Check if compiled-pdf branch exists
        if git show-ref --verify --quiet refs/heads/compiled-pdf; then
          # Branch exists, update it
          git checkout compiled-pdf
          git rm -f pneumatic.pdf || true
          git checkout main -- pneumatic.pdf
        else
          # Branch doesn't exist, create it
          git checkout -b compiled-pdf
          # Remove everything first to start clean
          git rm -rf . || true
          # Checkout the PDF from main branch
          git checkout main -- pneumatic.pdf
          git checkout main -- .gitignore || true
        fi
        
        # Add and commit the PDF
        git add pneumatic.pdf
        git commit -m "Update compiled PDF: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || echo "No changes to commit"
        git push origin compiled-pdf