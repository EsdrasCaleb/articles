name: Compile LaTeX Document

on:
  push:
    branches: [ main ]
    paths:
      - 'articles/**'
      - '.github/workflows/latex.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install additional LaTeX packages
      run: |
        tlmgr install geometry booktabs siunitx hyperref amsmath amsfonts amssymb graphicx enumitem microtype parskip setspace floatflt wrapfig || true
      
    - name: Compile LaTeX document
      uses: xu-cheng/texlive-action@v3
      with:
        run: |
          latexmk -pdf -interaction=nonstopmode main.tex
      
    - name: Save LaTeX log
      if: always()
      run: |
        if [ -f main.log ]; then
          cp main.log ./latexmk.log
        fi
      
    - name: Upload LaTeX log as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: latexmk-log
        path: ./latexmk.log
        retention-days: 1
      
    - name: Upload PDF as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: main-pdf
        path: main.pdf
        retention-days: 30
      
    - name: Create or update compiled-pdf branch
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.githubusercontent.com"
        
        # Configure git to allow pushing
        git config --global push.default simple
        
        # Check if compiled-pdf branch exists
        if git show-ref --verify --quiet refs/heads/compiled-pdf; then
          # Branch exists, update it
          git checkout compiled-pdf
          git rm -f main.pdf || true
          git checkout main -- main.pdf
        else
          # Branch doesn't exist, create it
          git checkout -b compiled-pdf
          # Remove everything first to start clean
          git rm -rf . || true
          # Checkout the PDF from main branch
          git checkout main -- main.pdf
          git checkout main -- .gitignore || true
        fi
        
        # Add and commit the PDF
        git add main.pdf
        git commit -m "Update compiled PDF: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || echo "No changes to commit"
        git push origin compiled-pdf
